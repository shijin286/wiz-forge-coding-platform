# Full stack with PostgreSQL:   docker compose up --build   ->   http://localhost:8080
# Optional AI review: put ANTHROPIC_API_KEY=... in a .env file next to this one.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wizforge
      POSTGRES_PASSWORD: wizforge_dev
      POSTGRES_DB: wizforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizforge"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://wizforge:wizforge_dev@db:5432/wizforge
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-0123456789abcdef}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
