server {
    listen 80;
    root /usr/share/nginx/html;

    # API requests go to the FastAPI container (AI reviews can take a while)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 1m;
    }

    # single-page app: unknown paths load index.html so React Router can handle them
    location / {
        try_files $uri /index.html;
    }
}
